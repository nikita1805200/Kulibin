<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кулибин — Образовательная платформа</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="brand">
      <span class="brand-name">Кулибин</span>
    </div>
    <nav class="nav-tabs">
      <button class="tab-btn" data-tab="tasks">Задания</button>
      <button class="tab-btn active" data-tab="generator">Генератор</button>
    </nav>
    <div class="user-profile">
      <span class="user-badge">Ученик</span>
    </div>
  </header>

  <main class="main-content">

    <section id="tasks-tab" class="tab-pane">
      <div class="empty-state">
        <h2>Активные задания</h2>
        <p>Для генерации и выбора тем перейдите во вкладку «Генератор».</p>
      </div>
    </section>

    <section id="generator-tab" class="tab-pane active">
      <div class="section-header">
        <h1>Генератор заданий</h1>
        <p>Настройте параметры или укажите тему для генерации</p>
      </div>
      <div class="generator-card">
        <div class="form-group">
          <label>Быстрые пресеты</label>
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <button type="button" class="tab-btn preset-btn" data-subject="algebra" data-grade="9" data-topic="Квадратные уравнения">ОГЭ: Алгебра 9 кл</button>
            <button type="button" class="tab-btn preset-btn" data-subject="algebra" data-grade="11" data-topic="Логарифмические уравнения">ЕГЭ: Алгебра 11 кл</button>
            <button type="button" class="tab-btn preset-btn" data-subject="physics" data-grade="10" data-topic="Кинематика и динамика">ЕГЭ: Физика 10 кл</button>
            <button type="button" class="tab-btn preset-btn" data-subject="cs" data-grade="11" data-topic="Динамическое программирование">Олимпиада: Информатика</button>
          </div>
        </div>
        <div class="form-group">
          <label for="gen-subject">Предмет</label>
          <select id="gen-subject" class="form-control"></select>
        </div>
        <div class="form-group">
          <label for="gen-grade">Класс</label>
          <select id="gen-grade" class="form-control"></select>
        </div>
        <div class="form-group">
          <label for="gen-topic">Тема по программе</label>
          <select id="gen-topic" class="form-control"></select>
        </div>
        <div class="form-group">
          <label for="gen-custom-topic">Или своя тема</label>
          <input type="text" id="gen-custom-topic" class="form-control" placeholder="Например: Теорема Пифагора в 3D">
        </div>
        <button id="btn-generate-task" class="primary-btn">Сгенерировать задание</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
