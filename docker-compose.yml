version: '3.8'

services:
  app:
    build: .
    container_name: kulibin_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - OLLAMA_HOST=http://ollama:11434
      - DEFAULT_MODEL=llama3.2:1b
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: kulibin_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
