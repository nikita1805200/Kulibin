services:
  app:
    build: .
    container_name: kulibin_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - OLLAMA_HOST=http://ollama:11434
      - DEFAULT_MODEL=qwen2.5-coder:14b
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: kulibin_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - E:/OllamaModels:/root/.ollama/models

